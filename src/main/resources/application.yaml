spring:
  application:
    name: inventory-reservation-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/inventory}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:pass}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true
inventory:
  reservation:
    max-attempts: 5